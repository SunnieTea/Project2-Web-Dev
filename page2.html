<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container">
        <h1>Choose Your Character</h1>
        <form id="characterForm" method="get" action="page3.html">
            <fieldset>
                <legend>Choose Your Character</legend>
                <fieldset>
                    <input type="radio" id="choice1" name="characterChoice" value="Aria,-the-Warrior">
                    <label for="choice1">
                        <strong>Aria, the Warrior:</strong> Strong and brave, with the ability
                        to overcome physical obstacles.
                    </label><br>
                </fieldset>
                <fieldset>
                    <input type="radio" id="choice2" name="characterChoice" value="Eldrin,-the-Mage">
                    <label for="choice2">
                        <strong>Eldrin, the Mage:</strong> Wise and knowledgeable, with the
                        power to solve puzzles and cast spells.
                    </label><br>
                </fieldset>
                <fieldset>
                    <input type="radio" id="choice3" name="characterChoice" value="Tara,-the-Rouge">
                    <label for="choice3">
                        <strong>Tara, the Rogue:</strong> Quick and cunning, with skills in
                        stealth and persuasion.
                    </label><br>
                </fieldset>
            </fieldset>
        </form>
        <button type="submit">Continue</button>
    </section>
</body>

</html>
